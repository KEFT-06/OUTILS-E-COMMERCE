# Collecteur maison : lit la bibliothèque publicitaire publique avec un navigateur piloté
# (Crawlee + Playwright) et verse ce qu'il trouve au site, toutes les quatre heures, sans frais
# de collecte : le mur d'Espionnage et les alertes tirées des publicités suivent la journée.
#
# Il passe aussi à la demande (workflow_dispatch, entrée « demandes ») : le site le lance quand un
# client cherche un mot que la lecture payante ne sert pas, et il ne lit alors que ces recherches.
#
# Pour qu'il VERSE ses relevés, ajouter dans le dépôt (Settings → Secrets and variables → Actions)
# le secret CRON_SECRET, identique à celui du site. Sans lui, le passage échoue et GitHub prévient.
name: Collecte des publicités

on:
  schedule:
    # Six passages par jour. Demande du propriétaire, 11/10/2026 : « je veux que ça tourne en continu ».
    - cron: '20 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      demandes:
        # Lancé par le site quand un client cherche un mot que la lecture payante ne sert pas.
        description: 'Passage court : seulement les recherches des clients en attente (oui / non)'
        required: false
        default: 'non'
  # Un passage aussi quand cet atelier change : son effet se vérifie tout de suite, sans attendre l'horaire.
  push:
    branches: [lot1-socle-de-confiance]
    paths: ['.github/workflows/collecte.yml']

# Un passage à la demande (la recherche d'un client) ne fait pas la queue derrière la tournée, qui
# dure une vingtaine de minutes : chacun a sa file. Deux demandes d'affilée n'en font qu'une — le
# passage suivant lit toutes les recherches en attente.
concurrency:
  group: ${{ inputs.demandes == 'oui' && 'collecte-a-la-demande' || 'collecte' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collecte:
    # Version fixée : « ubuntu-latest » change de version sans prévenir, et le navigateur s'installe
    # avec les paquets système de la version. Changer les deux lignes ensemble (ici et la clé du cache).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Avant d'installer un navigateur pour rien : le secret est-il là où un atelier peut le lire ?
      - name: Vérifier le secret
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Vrai ou faux, jamais la valeur : dit seulement si elle a été rangée au mauvais endroit.
          RANGE_EN_VARIABLE: ${{ vars.CRON_SECRET != '' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            if [ "$RANGE_EN_VARIABLE" = "true" ]; then
              echo "::error title=Secret mal rangé::CRON_SECRET est enregistré comme VARIABLE du dépôt, pas comme SECRET : un atelier ne lit un secret que dans l'onglet Secrets. Settings → Secrets and variables → Actions → onglet Secrets → New repository secret, nom CRON_SECRET, même valeur que sur le site ; puis supprimez la variable."
            else
              echo "::error title=Secret absent::CRON_SECRET est absent des secrets du dépôt. Settings → Secrets and variables → Actions → onglet Secrets → New repository secret (et non un secret d'environnement), nom CRON_SECRET, même valeur que sur le site."
            fi
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le collecteur
        run: npm --prefix collecteur ci
      # Le navigateur est gardé d'un passage à l'autre : un passage à la demande démarre sans le retélécharger.
      - name: Retrouver le navigateur
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: navigateur-ubuntu-24.04-${{ hashFiles('collecteur/package-lock.json') }}
      - name: Installer le navigateur
        run: npx --prefix collecteur playwright install --with-deps chromium
      - name: Collecter
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          COLLECTE_SITE: ${{ vars.COLLECTE_SITE || 'https://www.smartcreatorcm.com' }}
          COLLECTE_NAVIGATEUR: chromium
        run: node collecteur/collecte.mjs ${{ inputs.demandes == 'oui' && '--demandes' || '' }}
