# Vérifications automatiques à chaque envoi de code : types, relecture du code,
# tests serveur et client, construction du site, absence de secret côté navigateur.
# Aucune vraie clé n'est nécessaire : les tests utilisent des fournisseurs simulés.
name: Vérifications

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Relire le code
        run: npm run lint

      - name: Lancer les tests
        run: npm test

      - name: Construire le site
        run: npm run build

      - name: Aucun secret exposé au navigateur
        run: |
          if grep -rn "VITE_" src/; then
            echo "Une variable VITE_ est inlinée dans le code du navigateur : aucun secret ne doit y figurer."
            exit 1
          fi
